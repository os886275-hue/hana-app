; --- Derived Data Cache: allow two Windows users on one machine ---------------
;
; Zen auto-launches on a fixed port (8558). The first user's session owns it, and
; a second user's editor can neither bind that port nor use the other session's
; server -- so ZenLocal drops out of the hierarchy. BaseEngine.ini's filesystem
; Local node is DeleteOnly=true, leaving no writable node at all, which is fatal:
;   "Unable to use default cache graph ... there are no writable nodes available"
;
; Fix: turn Zen off for this project and make the filesystem node writable.
; %ENGINEVERSIONAGNOSTICUSERDIR% already resolves per Windows user, so each user
; gets their own cache under their own AppData -- no shared path, no contention.
; Trade-off: no Zen, and the two users do not share cached shader builds.

[Zen]
AutoLaunch=false

[InstalledDerivedDataBackendGraph]
Local=(Type=FileSystem, UnusedFileAge=8, Path="%ENGINEVERSIONAGNOSTICUSERDIR%DerivedDataCache", EnvPathOverride=UE-LocalDataCachePath, EditorOverrideSetting=LocalDerivedDataCache)

